# Label path untuk PR router gratis (.github/workflows/pr-router.yml).
# Labeler tidak pernah menjalankan kode PR; file ini hanya konfigurasi pencocokan path.

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - src/**
          - public/**

brand:
  - changed-files:
      - any-glob-to-any-file:
          - brand-source/**

scripts:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**

deps:
  - changed-files:
      - any-glob-to-any-file:
          - "**/package.json"
          - "**/package-lock.json"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
